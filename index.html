<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roguelike Géométrique</title>

<style>

/* =====================================================
   STYLE GÉNÉRAL DE LA PAGE
   ===================================================== */

/* Réglages de base : thème sombre + marges de sécurité (téléphones à encoche) */
:root {
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* La page prend tout l'écran, fond noir, texte blanc, pas de défilement */
html, body {
  margin: 0;
  height: 100%;
  background: #05050a;
  color: #fff;
  font-family: 'Segoe UI', system-ui, sans-serif;
  overflow: hidden;
  user-select: none;
}

/* Le canvas (la zone de jeu) remplit tout l'écran */
canvas {
  display: block;
  width: 100%;
  height: 100%;
}


/* =====================================================
   HUD (les infos affichées par-dessus le jeu)
   ===================================================== */

/* Conteneur du HUD : 3 colonnes en haut de l'écran (gauche / centre / droite) */
#hud {
  position: absolute;
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: 20px;
  right: 20px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  pointer-events: none; /* les clics passent à travers le HUD... */
  z-index: 5;
  text-shadow: 0 2px 4px #000;
}

/* Chaque colonne empile ses éléments verticalement */
#hud > div {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

/* .c = colonne centrée / .r = colonne alignée à droite */
.c {
  align-items: center;
  text-align: center;
}

.r {
  align-items: flex-end;
  text-align: right;
}

/* Barre de vie (fond gris transparent, coins arrondis) */
.bar {
  position: relative;
  width: 240px;
  max-width: 40vw;
  height: 22px;
  background: #ffffff18;
  border-radius: 11px;
  overflow: hidden;
  border: 1px solid #ffffff30;
}

/* Partie colorée de la barre (sa largeur change selon la valeur) */
.bar i {
  position: absolute;
  inset: 0 auto 0 0;
  width: 100%;
  background: linear-gradient(90deg, #ff2d95, #ff7a59);
  transition: width .15s;
}

/* Texte affiché sur la barre */
.bar b {
  position: relative;
  font-size: 13px;
  line-height: 22px;
  padding-left: 10px;
}

/* Variante : barre de bouclier (fine et bleue) */
.bar.sh {
  height: 7px;
}

.bar.sh i {
  background: #4cc9f0;
}

/* Variante : barre d'objectif de la vague (violet → cyan) */
.bar.o {
  width: 200px;
  height: 12px;
}

.bar.o i {
  background: linear-gradient(90deg, #7928ca, #00f2fe);
}

/* ...sauf pour le bouton du HUD, qui doit rester cliquable */
#hud button {
  pointer-events: auto;
  padding: 7px 14px;
  font-size: 14px;
  margin: 0;
}

/* Petits textes discrets */
small {
  opacity: .8;
  font-size: 12px;
}


/* =====================================================
   BOUTONS
   ===================================================== */

/* Apparence des boutons (dégradé violet/rose) */
button {
  padding: 12px 24px;
  font-size: 16px;
  font-weight: 700;
  background: linear-gradient(135deg, #7928ca, #c13584);
  color: #fff;
  border: 0;
  border-radius: 10px;
  cursor: pointer;
  transition: transform .15s, filter .15s;
}

/* Au survol : le bouton monte un peu et s'éclaircit */
button:hover:not(:disabled) {
  transform: translateY(-2px);
  filter: brightness(1.2);
}

/* Bouton désactivé (pas assez d'or, par exemple) */
button:disabled {
  opacity: .35;
  cursor: not-allowed;
}


/* =====================================================
   ÉCRANS SUPERPOSÉS (fin de vague, boutique, game over)
   ===================================================== */

/* .ov = "overlay" : un écran qui recouvre tout le jeu. Caché par défaut */
.ov {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: safe center;
  background: rgba(5, 5, 12, .9);
  backdrop-filter: blur(5px);
  z-index: 10;
  overflow: auto;
  text-align: center;
  padding: 16px;
  box-sizing: border-box;
}

/* Animation d'apparition en fondu */
@keyframes fi {
  from { opacity: 0; }
  to   { opacity: 1; }
}

.ov {
  animation: fi .8s ease;
}

/* Titres des écrans */
.ov h1 {
  font-size: 44px;
  margin: 0 0 8px;
  text-shadow: 0 0 24px #7928ca;
}

.ov h2 {
  margin: 0;
}

/* Rangée de boutons (retourne à la ligne si l'écran est étroit) */
.row {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  justify-content: center;
  margin: 18px 0;
}

/* Zone de texte des statistiques / bonus mystère */
#fst {
  max-width: 640px;
  line-height: 1.7;
  font-size: 14px;
  opacity: .9;
}


/* =====================================================
   BOUTIQUE
   ===================================================== */

/* Grille des objets : s'adapte automatiquement à la largeur de l'écran */
#grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px;
  width: min(960px, 94vw);
  margin: 16px 0;
}

/* Une carte d'objet */
.it {
  background: linear-gradient(160deg, #1c1c48, #12122c);
  border: 1px solid #3d3d7a;
  border-radius: 14px;
  padding: 12px;
}

/* Objet au niveau maximum : bordure dorée */
.it.mx {
  border-color: #ffd166;
}

/* Description de l'objet */
.it p {
  font-size: 12px;
  opacity: .75;
  margin: 6px 0 10px;
  min-height: 32px;
}

.it b {
  display: block;
}

/* Icône de l'objet (emoji) */
.ic {
  font-size: 30px;
}

/* Bouton d'achat (plus petit, pleine largeur de la carte) */
.it button {
  padding: 8px 14px;
  font-size: 14px;
  width: 100%;
}

</style>
</head>

<body>

<!-- =====================================================
     ZONE DE JEU : tout est dessiné dans ce canvas
     ===================================================== -->
<canvas id="c"></canvas>


<!-- =====================================================
     HUD : barres de vie, vague, or, score, commandes
     ===================================================== -->
<div id="hud">

  <!-- Colonne gauche : vie, bouclier, bouton de mode de combat -->
  <div>
    <div class="bar">
      <i id="hpb"></i>
      <b id="hpt"></b>
    </div>
    <div class="bar sh">
      <i id="shb"></i>
    </div>
    <button id="mode" onclick="toggle()">🤖 Combat auto [E]</button>
  </div>

  <!-- Colonne centrale : numéro de vague + objectif -->
  <div class="c">
    <div>🌊 Vague <span id="uv">1</span>/30</div>
    <div class="bar o">
      <i id="ob"></i>
    </div>
    <small id="ot"></small>
  </div>

  <!-- Colonne droite : or, score, recharges et rappel des touches -->
  <div class="r">
    <div>💰 <span id="ug">0</span> &nbsp; ⭐ <span id="us">0</span></div>
    <small id="ab"></small>
    <small>Déplacement ZQSD · Dash Espace · Pause P</small>
  </div>

</div>


<!-- =====================================================
     ÉCRAN DE FIN DE VAGUE (menu entre deux vagues)
     ===================================================== -->
<div class="ov" id="fin">
  <h1>🌊 Fin de vague !</h1>
  <p id="fsum"></p>

  <div class="row">
    <button onclick="openShop()">🛒 Boutique</button>
    <button onclick="next()">▶ Vague suivante</button>
    <button id="bheal" onclick="heal()"></button>
    <button id="bmys" onclick="mystery()"></button>
    <button onclick="stats()">📊 Statistiques</button>
  </div>

  <div id="fst"></div>
</div>


<!-- =====================================================
     BOUTIQUE (la liste des objets est remplie par le JS)
     ===================================================== -->
<div class="ov" id="shop">
  <h2>🛒 Boutique — 💰 <span id="sg"></span></h2>
  <div id="grid"></div>
  <button onclick="closeShop()">⬅ Retour</button>
</div>


<!-- =====================================================
     ÉCRAN DE FIN DE PARTIE (victoire ou game over)
     ===================================================== -->
<div class="ov" id="over">
  <h1 id="ot2"></h1>
  <p id="otx"></p>
  <button onclick="start()">🔁 Rejouer</button>
</div>

<script>

/* =====================================================
   1. MISE EN PLACE : canvas, taille de l'écran, raccourci $
   ===================================================== */

// cv = le canvas, ctx = le "pinceau" pour dessiner dessus,
// $ = petit raccourci pour récupérer un élément HTML par son id
const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');
const $   = id => document.getElementById(id);

// W et H = largeur et hauteur de l'écran
let W, H;

// Adapte le canvas à la taille de la fenêtre
function rs() {
  W = cv.width  = innerWidth;
  H = cv.height = innerHeight;
}

addEventListener('resize', rs); // refait le calcul si on redimensionne la fenêtre
rs();                           // et une première fois au démarrage


/* =====================================================
   2. LES OBJETS DE LA BOUTIQUE
   i = icône, n = nom, d = description,
   b = prix de base, m = niveau maximum
   ===================================================== */

const ITEMS = [
  { id: 'dmg',    i: '🗡️', n: 'Dégâts',          d: '+20 % de dégâts',                          b: 30, m: 10 },
  { id: 'rate',   i: '⚡',  n: 'Cadence',         d: 'Tire 12 % plus vite',                      b: 35, m: 8  },
  { id: 'hp',     i: '❤️', n: 'PV max',          d: '+25 PV max et soin',                       b: 25, m: 10 },
  { id: 'spd',    i: '👟', n: 'Vitesse',         d: '+0,4 de déplacement',                      b: 25, m: 6  },
  { id: 'multi',  i: '🔱', n: 'Tirs multiples',  d: '+1 projectile en éventail',                b: 80, m: 4  },
  { id: 'pierce', i: '🏹', n: 'Perforation',     d: 'Les tirs traversent +1 ennemi',            b: 60, m: 4  },
  { id: 'crit',   i: '🎯', n: 'Critique',        d: '+8 % de chance, dégâts ×2',                b: 45, m: 6  },
  { id: 'steal',  i: '🩸', n: 'Vol de vie',      d: 'Soigne 3 % des dégâts',                    b: 60, m: 5  },
  { id: 'regen',  i: '💚', n: 'Régénération',    d: '+0,5 PV par seconde',                      b: 50, m: 6  },
  { id: 'shield', i: '🛡️', n: 'Bouclier',        d: '+20 de bouclier, rechargé à chaque vague', b: 55, m: 6  },
  { id: 'magnet', i: '🧲', n: 'Aimant',          d: 'Attire l’or de plus loin',                 b: 30, m: 5  },
  { id: 'orbs',   i: '🌀', n: 'Orbes',           d: '+1 orbe tournant qui blesse',              b: 70, m: 6  },
  { id: 'dash',   i: '💨', n: 'Dash',            d: 'Recharge du dash −15 %',                   b: 30, m: 5  },
  { id: 'nova',   i: '💥', n: 'Nova [R]',        d: 'Onde de choc, plus forte et plus rapide',  b: 90, m: 6  },
  { id: 'gold',   i: '💰', n: 'Chasseur d’or',   d: '+15 % d’or gagné',                         b: 40, m: 5  }
];

// Couleur des ennemis selon leur nombre de côtés (3 = triangle, 4 = carré...)
const COL = { 3: '#ff2d95', 4: '#ff9f1c', 5: '#2ec4b6', 6: '#3a86ff' };


/* =====================================================
   3. VARIABLES GLOBALES DU JEU
   ===================================================== */

let lv;       // niveaux des objets achetés (ex : lv.dmg = 3)
let J;        // le joueur (position, vie, stats...)
let en;       // liste des ennemis
let pb;       // projectiles du joueur ("player bullets")
let eb;       // projectiles des ennemis ("enemy bullets")
let coins;    // pièces d'or au sol
let pt;       // particules (petits effets visuels)
let ft;       // textes flottants (dégâts, or gagné...)
let rings;    // anneaux d'onde de choc (effets visuels)
let vague;    // numéro de la vague actuelle
let toSpawn;  // nombre d'ennemis qu'il reste à faire apparaître
let spawnT;   // minuteur avant la prochaine apparition
let state = 'PLAY'; // état du jeu : PLAY, PAUSE, CLEAR, FIN ou OVER
let auto = true;    // true = combat automatique, false = visée à la souris
let tot;      // total d'ennemis à tuer dans la vague
let wk;       // nombre d'ennemis déjà tués dans la vague
let gold;     // or du joueur
let score;    // score du joueur
let shk = 0;  // intensité du tremblement d'écran
let best = 0; // meilleur record (vague la plus haute atteinte)
let ct = 0;   // compte à rebours entre la fin de vague et le menu
let bn = 0;   // durée d'affichage de la bannière "Vague X"
let lastB = 0;// bonus d'or reçu à la fin de la dernière vague
let tick = 0; // compteur de temps global (sert aux animations)
let tw;       // texte de la bannière ("Vague 3" ou "⚠ BOSS")

// Récupère le record sauvegardé dans le navigateur (si possible)
try {
  best = +localStorage.getItem('rgb') || 0;
} catch (e) {}

// Étoiles du fond (position, taille et phase de scintillement aléatoires)
const stars = Array.from({ length: 90 }, () => ({
  x: Math.random(),
  y: Math.random(),
  s: Math.random() * 1.6 + .4,
  p: Math.random() * 6
}));


/* =====================================================
   4. CLAVIER ET SOURIS
   ===================================================== */

// K retient les touches actuellement enfoncées (ex : K.z = 1)
const K = {};

// Position de la souris et état du clic
let mx = 0, my = 0, md = false;

// Quand on appuie sur une touche
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  K[k] = 1;

  // Empêche la page de défiler avec Espace et les flèches
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();

  if (k === 'e') toggle();      // E = changer de mode de combat
  if (k === ' ') dash();        // Espace = dash
  if (k === 'r') nova();        // R = nova

  // P = pause / reprise
  if (k === 'p') {
    if (state === 'PLAY') state = 'PAUSE';
    else if (state === 'PAUSE') state = 'PLAY';
  }
});

// Quand on relâche une touche
addEventListener('keyup', e => K[e.key.toLowerCase()] = 0);

// Suit la souris
addEventListener('pointermove', e => {
  mx = e.clientX;
  my = e.clientY;
});

// Clic enfoncé sur le jeu = on veut tirer (mode manuel)
cv.addEventListener('pointerdown', e => {
  md = true;
  mx = e.clientX;
  my = e.clientY;
});

// Clic relâché
addEventListener('pointerup', () => md = false);

// Retire le focus des boutons après un clic (évite que Espace les re-déclenche)
addEventListener('click', e => e.target.blur && e.target.blur());

// Désactive le menu clic droit sur le jeu
cv.addEventListener('contextmenu', e => e.preventDefault());

// Bascule entre combat automatique et combat manuel
function toggle() {
  auto = !auto;
  $('mode').textContent = auto ? '🤖 Combat auto [E]' : '🎯 Combat manuel [E]';
  cv.style.cursor = auto ? 'default' : 'crosshair';
}


/* =====================================================
   5. STATS DU JOUEUR
   ===================================================== */

// Prix d'un objet : il augmente de 45 % à chaque niveau acheté
const cost = it => Math.round(it.b * Math.pow(1.45, lv[it.id]));

// Recalcule toutes les stats du joueur à partir des niveaux des objets
function recalc() {
  J.dmg    = 15 * (1 + .2 * lv.dmg);                    // dégâts
  J.rate   = Math.max(5, 22 * Math.pow(.88, lv.rate));  // délai entre 2 tirs (plus petit = plus rapide)
  J.mhp    = 100 + 25 * lv.hp;                          // PV max
  J.spd    = 4 + .35 * lv.spd;                          // vitesse
  J.multi  = 1 + lv.multi;                              // nombre de projectiles
  J.pierce = lv.pierce;                                 // nombre d'ennemis traversés
  J.crit   = .05 + .08 * lv.crit;                       // chance de critique
  J.steal  = .03 * lv.steal;                            // vol de vie
  J.regen  = .5 * lv.regen;                             // régénération par seconde
  J.smax   = 20 * lv.shield;                            // bouclier max
  J.magnet = 90 + 60 * lv.magnet;                       // portée de l'aimant à or
  J.orbs   = lv.orbs;                                   // nombre d'orbes
  J.dashCd = 90 * Math.pow(.85, lv.dash);               // recharge du dash
  J.novaCd = 480 - 48 * lv.nova;                        // recharge de la nova
  J.gm     = 1 + .15 * lv.gold;                         // multiplicateur d'or

  // La vie et le bouclier ne peuvent pas dépasser leur maximum
  J.hp = Math.min(J.hp, J.mhp);
  J.sh = Math.min(J.sh, J.smax);
}


/* =====================================================
   6. DÉMARRAGE D'UNE PARTIE ET D'UNE VAGUE
   ===================================================== */

// Cache tous les écrans superposés
function hide() {
  document.querySelectorAll('.ov').forEach(o => o.style.display = 'none');
}

// Nouvelle partie : remet tout à zéro
function start() {
  // Tous les objets repartent au niveau 0
  lv = {};
  ITEMS.forEach(i => lv[i.id] = 0);

  // Création du joueur au centre de l'écran
  J = {
    x: W / 2, y: H / 2, r: 15,   // position et rayon
    hp: 100, sh: 0,              // vie et bouclier
    fire: 0,                     // minuteur de tir
    inv: 0,                      // invincibilité après un coup
    dc: 0, dt: 0,                // recharge du dash / durée du dash en cours
    dx: 0, dy: -1,               // direction du dernier mouvement
    nc: 0,                       // recharge de la nova
    ang: 0, aim: 0               // angle de rotation / angle de visée
  };

  recalc();
  J.hp = J.mhp;

  // Remise à zéro de la progression et des listes
  vague = 1;
  gold = 0;
  score = 0;
  pt = [];
  ft = [];
  rings = [];
  coins = [];

  hide();
  begin();
}

// Lance la vague actuelle
function begin() {
  en = [];
  pb = [];
  eb = [];
  wk = 0;
  spawnT = 130;

  // Toutes les 5 vagues, il y a un boss
  const boss = vague % 5 === 0;

  if (boss) {
    // Nombre de boss : 1, puis 2 à la vague 15, 3 à la vague 30
    const b = 1 + (vague / 15 | 0);
    for (let i = 0; i < b; i++) spawn(1);

    // Quelques ennemis normaux en renfort
    toSpawn = 4 + (vague / 5 | 0);
    tot = toSpawn + b;
  } else {
    // Vague normale : le nombre d'ennemis grandit avec la vague
    tot = toSpawn = 3 + (vague * 1.6 | 0);
  }

  // Le joueur revient au centre avec son bouclier rechargé
  J.sh = J.smax;
  J.x = W / 2;
  J.y = H / 2;

  state = 'PLAY';
  bn = 150;
  tw = boss ? '⚠ BOSS' : 'Vague ' + vague;
}


/* =====================================================
   7. ENNEMIS, TIRS ET EFFETS
   ===================================================== */

// Fait apparaître un ennemi (si boss est vrai, c'est un boss)
function spawn(boss) {

  // --- Cas du boss : un gros octogone qui arrive par le haut ---
  if (boss) {
    const h = 300 + vague * 45; // points de vie du boss
    en.push({
      x: W / 2 + (Math.random() - .5) * 200,
      y: -60,
      c: 8,                    // 8 côtés
      r: 46,                   // rayon
      hp: h, mh: h,            // vie actuelle / vie max
      s: .5,                   // vitesse
      d: 22 * (1 + vague * .03), // dégâts au contact
      boss: 1,
      t: 0, oc: 0, rot: 0,
      col: '#b388ff',
      gv: 60 + vague * 4       // or lâché à sa mort
    });
    return;
  }

  // --- Cas d'un ennemi normal : il arrive depuis un bord au hasard ---
  const side = Math.random() * 4 | 0; // 0 = gauche, 1 = droite, 2 = haut, 3 = bas
  let x, y;

  if (side < 2) {
    x = side ? W + 30 : -30;
    y = Math.random() * H;
  } else {
    y = side === 2 ? -30 : H + 30;
    x = Math.random() * W;
  }

  // Formes possibles : triangle et carré, puis pentagone (vague 3), hexagone (vague 6)
  const p = [3, 4];
  if (vague >= 3) p.push(5);
  if (vague >= 6) p.push(6);

  const c  = p[Math.random() * p.length | 0]; // nombre de côtés choisi
  const hp = c * 10 + vague * 6;              // vie de l'ennemi

  en.push({
    x, y, c,
    r: c * 3.5 + 9,                                                    // rayon
    hp, mh: hp,                                                        // vie actuelle / max
    s: Math.max(.4, .95 - c * .08 + vague * .012) * (c === 3 ? 1.2 : 1), // vitesse
    d: c * 3 * (1 + vague * .03),                                      // dégâts au contact
    t: Math.random() * 100 | 0,                                        // minuteur interne
    oc: 0,                                                             // délai entre 2 touches d'orbe
    rot: 0,                                                            // rotation (visuel)
    col: COL[c]
  });
}

// Un ennemi tire un projectile (angle a, vitesse s, dégâts d)
function shoot(e, a, s, d) {
  eb.push({
    x: e.x,
    y: e.y,
    vx: Math.cos(a) * s,
    vy: Math.sin(a) * s,
    d
  });
}

// Explosion de particules (n particules de couleur col, vitesse max sp)
function burst(x, y, col, n, sp = 4) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 7;
    const s = Math.random() * sp;
    pt.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      l: 25 + Math.random() * 25,   // durée de vie
      z: 1.5 + Math.random() * 2.5, // taille
      col
    });
  }
}

// Le joueur tire dans la direction a (plusieurs tirs en éventail si "multi")
function fire(a) {
  const n = J.multi;

  for (let i = 0; i < n; i++) {
    // Décale chaque projectile pour former un éventail
    const an = a + (i - (n - 1) / 2) * .16;

    // Tirage au sort du coup critique
    const cr = Math.random() < J.crit;

    pb.push({
      x: J.x, y: J.y,
      px: J.x, py: J.y,                 // ancienne position (pour la traînée)
      vx: Math.cos(an) * 10,
      vy: Math.sin(an) * 10,
      d: J.dmg * (cr ? 2 : 1),          // dégâts (x2 si critique)
      pi: J.pierce,                     // ennemis qu'il peut encore traverser
      cr,                               // est-ce un critique ?
      h: []                             // ennemis déjà touchés par ce tir
    });
  }

  // Petite étincelle au bout du canon
  burst(J.x + Math.cos(a) * 20, J.y + Math.sin(a) * 20, '#ffd166', 3, 2);
}

// Inflige des dégâts d à un ennemi e (cr = critique ou non)
function damage(e, d, cr) {
  if (e.dead) return;

  e.hp -= d;
  e.fl = 4; // l'ennemi clignote en blanc un instant

  // Vol de vie : le joueur récupère une partie des dégâts
  J.hp = Math.min(J.mhp, J.hp + d * J.steal);

  // Chiffre de dégâts flottant
  ft.push({
    x: e.x + (Math.random() - .5) * 20,
    y: e.y - e.r,
    t: 40,
    s: Math.round(d),
    c: cr ? '#ffd166' : '#fff',
    z: cr ? 20 : 14
  });

  burst(e.x, e.y, e.col, 3);

  // Si l'ennemi n'a plus de vie, il meurt
  if (e.hp <= 0) {
    e.dead = 1;
    kill(e);
  }
}

// Mort d'un ennemi : score, effets visuels et pièces d'or
function kill(e) {
  wk++;
  score += (e.c || 3) * 10;

  burst(e.x, e.y, e.col, e.boss ? 60 : 20, e.boss ? 7 : 5);
  rings.push({ x: e.x, y: e.y, r: e.r, m: e.r + 40, col: e.col });
  shk += e.boss ? 15 : 3;

  // Valeur totale de l'or lâché, et nombre de pièces
  const v = e.boss ? e.gv : e.c + (vague >> 1);
  const n = e.boss ? 12 : 2;

  for (let i = 0; i < n; i++) {
    const a = Math.random() * 7;
    const s = 1 + Math.random() * 3;
    coins.push({
      x: e.x, y: e.y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      v: Math.max(1, Math.ceil(v * J.gm / n))
    });
  }
}

// Le joueur subit des dégâts d
function hurt(d) {
  // Invincible juste après un coup
  if (J.inv > 0) return;

  J.inv = 30;
  shk += 6;

  // Le bouclier absorbe les dégâts en premier
  let r = d;
  if (J.sh > 0) {
    const a = Math.min(J.sh, r);
    J.sh -= a;
    r -= a;
  }

  // Le reste est retiré de la vie
  J.hp -= r;

  burst(J.x, J.y, '#ff4d6d', 10);
  ft.push({
    x: J.x,
    y: J.y - 22,
    t: 40,
    s: '-' + Math.ceil(d),
    c: '#ff4d6d',
    z: 16
  });

  // Plus de vie = fin de partie
  if (J.hp <= 0) over(false);
}


/* =====================================================
   8. CAPACITÉS : DASH ET NOVA
   ===================================================== */

// Dash : une courte ruée dans la direction du déplacement
function dash() {
  // Impossible si le dash est en recharge ou si on n'est pas en combat
  if (J.dc > 0 || state !== 'PLAY') return;

  // Direction choisie avec les touches (flèches ou ZQSD)
  let dx = (K.d || K.arrowright ? 1 : 0) - (K.q || K.arrowleft ? 1 : 0);
  let dy = (K.s || K.arrowdown ? 1 : 0) - (K.z || K.arrowup ? 1 : 0);

  // Si une direction est donnée, on la normalise (longueur = 1)
  if (dx || dy) {
    const l = Math.hypot(dx, dy);
    J.dx = dx / l;
    J.dy = dy / l;
  }

  J.dt = 10;                       // le dash dure 10 images
  J.dc = J.dashCd;                 // lance la recharge
  J.inv = Math.max(J.inv, 16);     // invincible pendant le dash
}

// Nova : onde de choc qui blesse les ennemis proches et efface leurs tirs
function nova() {
  if (!lv.nova || J.nc > 0 || state !== 'PLAY') return;

  J.nc = J.novaCd;
  const d = 50 + 30 * lv.nova; // dégâts de la nova

  // Blesse tous les ennemis dans un rayon de 280
  for (const e of en) {
    if (Math.hypot(e.x - J.x, e.y - J.y) < 280 + e.r) damage(e, d, 0);
  }

  // Supprime les tirs ennemis dans la zone
  eb = eb.filter(b => Math.hypot(b.x - J.x, b.y - J.y) > 280);

  rings.push({ x: J.x, y: J.y, r: 10, m: 280, col: '#ffd166', w: 6 });
  shk += 8;
}


/* =====================================================
   9. MISE À JOUR DU JEU (appelée ~60 fois par seconde)
   ===================================================== */

function update() {
  tick++;

  // --- Déplacement du joueur (ZQSD ou flèches) ---
  let dx = (K.d || K.arrowright ? 1 : 0) - (K.q || K.arrowleft ? 1 : 0);
  let dy = (K.s || K.arrowdown ? 1 : 0) - (K.z || K.arrowup ? 1 : 0);

  // En diagonale, on normalise pour ne pas aller plus vite
  if (dx || dy) {
    const l = Math.hypot(dx, dy);
    dx /= l;
    dy /= l;
    J.dx = dx;
    J.dy = dy;
  }

  if (J.dt > 0) {
    // Pendant un dash : déplacement rapide + traînée de particules
    J.dt--;
    J.x += J.dx * 14;
    J.y += J.dy * 14;
    burst(J.x, J.y, '#00f2fe', 2, 1);
  } else {
    // Déplacement normal
    J.x += dx * J.spd;
    J.y += dy * J.spd;
  }

  // Le joueur ne peut pas sortir de l'écran
  J.x = Math.max(J.r, Math.min(W - J.r, J.x));
  J.y = Math.max(J.r, Math.min(H - J.r, J.y));

  // --- Minuteurs du joueur ---
  if (J.inv > 0) J.inv--;   // invincibilité
  if (J.dc > 0) J.dc--;     // recharge du dash
  if (J.nc > 0) J.nc--;     // recharge de la nova
  J.ang += .06;             // rotation visuelle
  J.hp = Math.min(J.mhp, J.hp + J.regen / 60); // régénération
  if (bn > 0) bn--;         // bannière de vague

  // --- Visée ---
  let tx, ty, want = false; // cible (tx, ty) et "veut tirer ?"

  if (auto) {
    // Mode auto : vise l'ennemi le plus proche
    if (en.length) {
      let b = null, bd = 1e9;
      for (const e of en) {
        const d = (e.x - J.x) ** 2 + (e.y - J.y) ** 2;
        if (d < bd) {
          bd = d;
          b = e;
        }
      }
      tx = b.x;
      ty = b.y;
      want = true;
    }
  } else {
    // Mode manuel : vise la souris, tire si on clique
    tx = mx;
    ty = my;
    want = md;

    // Aimant à ennemis : si la souris est proche d'un ennemi, on le vise lui
    for (const e of en) {
      if (Math.hypot(e.x - mx, e.y - my) < e.r + 45) {
        tx = e.x;
        ty = e.y;
        break;
      }
    }
  }

  if (tx !== undefined) J.aim = Math.atan2(ty - J.y, tx - J.x);

  // --- Tir ---
  J.fire--;
  if (want && J.fire <= 0) {
    J.fire = J.rate;
    fire(J.aim);
  }

  // --- Apparition des ennemis de la vague ---
  if (state === 'PLAY' && toSpawn > 0 && --spawnT <= 0) {
    spawn();
    toSpawn--;
    spawnT = Math.max(35, 75 - vague);
  }

  // --- Comportement des ennemis ---
  for (const e of en) {
    const a    = Math.atan2(J.y - e.y, J.x - e.x); // direction vers le joueur
    const dist = Math.hypot(J.x - e.x, J.y - e.y); // distance au joueur

    e.t++;
    e.rot += .012;
    if (e.oc > 0) e.oc--;
    if (e.fl > 0) e.fl--;

    // Les pentagones reculent s'ils sont trop près, les autres foncent sur le joueur
    const sp = e.c === 5 && dist < 260 ? -.3 : e.s;
    e.x += Math.cos(a) * sp;
    e.y += Math.sin(a) * sp;

    // Les pentagones tirent vers le joueur toutes les 150 images
    if (e.c === 5 && e.t % 150 === 0) shoot(e, a, 2.6, 8 * (1 + vague * .03));

    // Le boss tire 12 projectiles en cercle toutes les 140 images
    if (e.boss && e.t % 140 === 0) {
      for (let i = 0; i < 12; i++) shoot(e, i * Math.PI / 6 + e.t * .01, 2.2, 10);
    }

    // Contact avec le joueur = dégâts
    if (dist < J.r + e.r) hurt(e.d);
  }

  // --- Orbes tournantes autour du joueur ---
  for (let i = 0; i < J.orbs; i++) {
    const a  = J.ang * 1.5 + i * 6.2832 / J.orbs;
    const ox = J.x + Math.cos(a) * 62;
    const oy = J.y + Math.sin(a) * 62;

    // Chaque orbe blesse les ennemis qu'elle touche (avec un petit délai)
    for (const e of en) {
      if (e.oc <= 0 && Math.hypot(e.x - ox, e.y - oy) < e.r + 9) {
        damage(e, J.dmg * .7, 0);
        e.oc = 20;
      }
    }
  }

  // --- Projectiles du joueur ---
  for (let i = pb.length - 1; i >= 0; i--) {
    const p = pb[i];

    // Mémorise l'ancienne position puis avance
    p.px = p.x;
    p.py = p.y;
    p.x += p.vx;
    p.y += p.vy;

    // Supprime le tir s'il sort de l'écran
    if (p.x < -20 || p.x > W + 20 || p.y < -20 || p.y > H + 20) {
      pb.splice(i, 1);
      continue;
    }

    // Teste la collision avec chaque ennemi
    for (const e of en) {
      // On ignore les ennemis morts, déjà touchés, ou trop loin
      if (e.dead || p.h.includes(e) || Math.hypot(p.x - e.x, p.y - e.y) >= e.r + 10) continue;

      damage(e, p.d, p.cr);
      p.h.push(e);

      // Plus de perforation : le tir disparaît
      if (p.pi <= 0) {
        pb.splice(i, 1);
        break;
      }
      p.pi--;
    }
  }

  // Retire les ennemis morts de la liste
  en = en.filter(e => !e.dead);

  // --- Projectiles ennemis ---
  for (let i = eb.length - 1; i >= 0; i--) {
    const b = eb[i];
    b.x += b.vx;
    b.y += b.vy;

    // Supprime le tir s'il sort de l'écran
    if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
      eb.splice(i, 1);
      continue;
    }

    // Touche le joueur : dégâts + le tir disparaît
    if (Math.hypot(b.x - J.x, b.y - J.y) < J.r + 5) {
      hurt(b.d);
      eb.splice(i, 1);
    }
  }

  // --- Pièces d'or ---
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    const d = Math.hypot(J.x - c.x, J.y - c.y);

    // La pièce glisse puis ralentit (frottement)
    c.x += c.vx;
    c.y += c.vy;
    c.vx *= .94;
    c.vy *= .94;

    // Attirée par le joueur (aimant), ou automatiquement en fin de vague
    if (d < J.magnet || state === 'CLEAR') {
      const a = Math.atan2(J.y - c.y, J.x - c.x);
      const s = state === 'CLEAR' ? 14 : 6;
      c.x += Math.cos(a) * s;
      c.y += Math.sin(a) * s;
    }

    // Ramassée si on la touche
    if (d < J.r + 8) {
      gold += c.v;
      ft.push({ x: J.x, y: J.y - 24, t: 30, s: '+' + c.v, c: '#ffd166', z: 12 });
      coins.splice(i, 1);
    }
  }

  // --- Fin de vague : plus d'ennemis à venir ni à l'écran ---
  if (state === 'PLAY' && toSpawn <= 0 && !en.length) {
    state = 'CLEAR';
    ct = 170;   // petit délai pour ramasser l'or
    eb = [];    // efface les tirs restants
  }

  // Quand le délai est écoulé, on ouvre le menu de fin de vague
  if (state === 'CLEAR' && --ct <= 0) endWave();
}


/* =====================================================
   10. FIN DE VAGUE, BOUTIQUE ET FIN DE PARTIE
   ===================================================== */

// Termine la vague : donne un bonus d'or et affiche le menu
function endWave() {
  lastB = Math.round((10 + vague * 3) * J.gm); // bonus d'or de fin de vague
  gold += lastB;
  score += vague * 50;
  saveBest();

  state = 'FIN';
  refreshFin();
  $('fin').style.display = 'flex';
}

// Sauvegarde le record si on a battu l'ancien
function saveBest() {
  if (vague > best) {
    best = vague;
    try {
      localStorage.setItem('rgb', best);
    } catch (e) {}
  }
}

// Prix du soin et prix du bonus mystère (augmentent avec la vague)
function hc() { return 30 + vague * 3; }
function mc() { return 60 + vague * 3; }

// Met à jour les textes et boutons du menu de fin de vague
function refreshFin() {
  $('fsum').innerHTML = `Vague ${vague}/30 terminée · bonus +${lastB} 💰 · Or : <b>${gold}</b> · Record : vague ${best}`;

  // Bouton soin : grisé si pas assez d'or ou déjà full vie
  $('bheal').textContent = `💊 Se soigner (+40 % PV) — ${hc()} 💰`;
  $('bheal').disabled = gold < hc() || J.hp >= J.mhp;

  // Bouton mystère : grisé si pas assez d'or
  $('bmys').textContent = `🎲 Bonus mystère — ${mc()} 💰`;
  $('bmys').disabled = gold < mc();
}

// Achète un soin : rend 40 % des PV max
function heal() {
  if (gold < hc()) return;

  gold -= hc();
  J.hp = Math.min(J.mhp, J.hp + J.mhp * .4);
  refreshFin();
}

// Achète un bonus mystère : monte d'un niveau un objet tiré au hasard
function mystery() {
  if (gold < mc()) return;

  // Liste des objets qui ne sont pas encore au niveau max
  const o = ITEMS.filter(i => lv[i.id] < i.m);
  if (!o.length) return;

  gold -= mc();

  const it = o[Math.random() * o.length | 0];
  lv[it.id]++;
  recalc();

  // Les PV max donnent aussi du soin
  if (it.id === 'hp') J.hp += 25;

  $('fst').innerHTML = `🎲 Bonus obtenu : ${it.i} <b>${it.n}</b> passe au niveau ${lv[it.id]} !`;
  refreshFin();
}

// Affiche les statistiques actuelles du joueur
function stats() {
  $('fst').innerHTML = `🗡️ Dégâts ${J.dmg.toFixed(1)} · ⚡ ${(60 / J.rate).toFixed(1)} tirs/s · ❤️ PV max ${J.mhp} · 👟 Vitesse ${J.spd.toFixed(1)}<br>🔱 ${J.multi} projectile(s) · 🏹 Perfo ${J.pierce} · 🎯 Critique ${Math.round(J.crit * 100)} % · 🩸 Vol de vie ${Math.round(J.steal * 100)} %<br>💚 Régén ${J.regen.toFixed(1)}/s · 🛡️ Bouclier ${J.smax} · 🌀 Orbes ${J.orbs} · 💥 Nova niv. ${lv.nova} · 💰 Or ×${J.gm.toFixed(2)} · ⭐ Score ${score}`;
}

// Ouvre la boutique
function openShop() {
  $('fin').style.display = 'none';
  $('shop').style.display = 'flex';
  render();
}

// Ferme la boutique et revient au menu de fin de vague
function closeShop() {
  $('shop').style.display = 'none';
  $('fin').style.display = 'flex';
  refreshFin();
}

// Construit la liste des cartes de la boutique
function render() {
  $('sg').textContent = gold;

  $('grid').innerHTML = ITEMS.map(it => {
    const l    = lv[it.id];    // niveau actuel
    const full = l >= it.m;    // niveau max atteint ?
    const c    = cost(it);     // prix actuel

    return `<div class="it${full ? ' mx' : ''}"><div class="ic">${it.i}</div><b>${it.n}</b><small>Niveau ${l}/${it.m}</small><p>${it.d}</p><button ${full || gold < c ? 'disabled' : ''} onclick="buy('${it.id}')">${full ? 'MAX' : '💰 ' + c}</button></div>`;
  }).join('');
}

// Achète un objet de la boutique
function buy(id) {
  const it = ITEMS.find(i => i.id === id);
  const c  = cost(it);

  // Refuse si pas assez d'or ou déjà au max
  if (gold < c || lv[id] >= it.m) return;

  gold -= c;
  lv[id]++;
  recalc();

  // Bonus immédiats pour certains objets
  if (id === 'hp') J.hp += 25;
  if (id === 'shield') J.sh += 20;

  render();
}

// Passe à la vague suivante (ou gagne la partie après la vague 30)
function next() {
  $('fin').style.display = 'none';
  vague++;

  if (vague > 30) {
    vague = 30;
    over(true);
  } else {
    begin();
  }
}

// Fin de partie : victoire (win = true) ou défaite
function over(win) {
  state = 'OVER';
  saveBest();

  $('over').style.display = 'flex';
  $('ot2').textContent = win ? 'Victoire légendaire ! 🏆' : 'Game Over 💥';
  $('otx').innerHTML = win
    ? `Tu as survécu aux 30 vagues ! Score : ${score}`
    : `Tu as atteint la vague ${vague}. Score : ${score}<br>Record : vague ${best}`;
}


/* =====================================================
   11. DESSIN DU JEU
   ===================================================== */

// Dessine un polygone régulier (n côtés, rayon r, rotation rot)
function poly(x, y, r, n, rot) {
  ctx.beginPath();

  for (let i = 0; i < n; i++) {
    const a = i * 6.2832 / n - 1.5708 + rot;

    if (i) ctx.lineTo(x + r * Math.cos(a), y + r * Math.sin(a));
    else   ctx.moveTo(x + r * Math.cos(a), y + r * Math.sin(a));
  }

  ctx.closePath();
}

// Dessine toute une image du jeu
function draw() {

  // --- Fond : dégradé radial sombre ---
  const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * .7);
  g.addColorStop(0, '#14143a');
  g.addColorStop(1, '#05050a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // --- Tremblement d'écran (diminue peu à peu) ---
  ctx.save();
  shk *= .85;
  if (shk > .3) ctx.translate((Math.random() - .5) * shk, (Math.random() - .5) * shk);

  // --- Grille du fond (bouge légèrement avec le joueur) ---
  ctx.strokeStyle = '#ffffff0a';
  ctx.lineWidth = 1;

  const ox = -(J.x * .04) % 60;
  const oy = -(J.y * .04) % 60;

  ctx.beginPath();
  for (let x = ox; x < W; x += 60) {
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
  }
  for (let y = oy; y < H; y += 60) {
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
  }
  ctx.stroke();

  // --- Étoiles qui scintillent ---
  for (const s of stars) {
    ctx.globalAlpha = .3 + .4 * Math.sin(tick * .03 + s.p);
    ctx.fillStyle = '#fff';
    ctx.fillRect(s.x * W, s.y * H, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  // --- Anneaux d'onde de choc (s'agrandissent puis disparaissent) ---
  for (const r of rings) {
    r.r += (r.m - r.r) * .15 + 1;
    ctx.globalAlpha = Math.max(0, 1 - r.r / r.m);
    ctx.strokeStyle = r.col;
    ctx.lineWidth = r.w || 3;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, 7);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  rings = rings.filter(r => r.r < r.m - 1); // retire les anneaux finis

  // --- Pièces d'or ---
  for (const c of coins) {
    ctx.shadowColor = '#ffd166';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#ffd166';
    ctx.beginPath();
    ctx.arc(c.x, c.y, 5, 0, 7);
    ctx.fill();

    // Petit reflet blanc
    ctx.fillStyle = '#fff8';
    ctx.fillRect(c.x - 1, c.y - 3, 2, 3);
  }
  ctx.shadowBlur = 0;

  // --- Ennemis ---
  for (const e of en) {
    // Forme extérieure (lumineuse, blanche quand l'ennemi est touché)
    ctx.shadowColor = e.col;
    ctx.shadowBlur = e.fl > 0 ? 32 : 16;
    poly(e.x, e.y, e.r, e.c, e.rot);
    ctx.fillStyle = e.col + '44';
    ctx.fill();
    ctx.lineWidth = e.boss ? 4 : 3;
    ctx.strokeStyle = e.fl > 0 ? '#fff' : e.col;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Forme intérieure (tourne dans l'autre sens)
    poly(e.x, e.y, e.r * .55, e.c, -e.rot * 2);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#ffffff99';
    ctx.stroke();

    // Barre de vie au-dessus de l'ennemi (seulement s'il est blessé)
    if (e.hp < e.mh) {
      const w = Math.max(30, e.r * 1.6);
      ctx.fillStyle = '#000a';
      ctx.fillRect(e.x - w / 2, e.y - e.r - 12, w, 5);
      ctx.fillStyle = e.boss ? '#b388ff' : '#5eff8a';
      ctx.fillRect(e.x - w / 2, e.y - e.r - 12, w * e.hp / e.mh, 5);
    }
  }

  // Mode "lumière" : les couleurs s'additionnent (effet néon)
  ctx.globalCompositeOperation = 'lighter';

  // --- Projectiles du joueur (traits lumineux) ---
  for (const p of pb) {
    ctx.strokeStyle = p.cr ? '#ff7b00' : '#ffd166';
    ctx.lineWidth = p.cr ? 5 : 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(p.px - p.vx * 1.5, p.py - p.vy * 1.5);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }

  // --- Projectiles ennemis (boules rouges) ---
  for (const b of eb) {
    ctx.shadowColor = '#ff3b3b';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#ff5a5a';
    ctx.beginPath();
    ctx.arc(b.x, b.y, 5, 0, 7);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // --- Particules (bougent, ralentissent, puis disparaissent) ---
  for (let i = pt.length - 1; i >= 0; i--) {
    const p = pt[i];

    p.x += p.vx;
    p.y += p.vy;
    p.vx *= .95;
    p.vy *= .95;
    p.l--;

    if (p.l <= 0) {
      pt.splice(i, 1);
      continue;
    }

    ctx.globalAlpha = Math.min(1, p.l / 25);
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x, p.y, p.z, p.z);
  }

  // Retour au mode de dessin normal
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  // --- Orbes tournantes autour du joueur ---
  for (let i = 0; i < J.orbs; i++) {
    const a = J.ang * 1.5 + i * 6.2832 / J.orbs;

    ctx.shadowColor = '#b388ff';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#d9c2ff';
    ctx.beginPath();
    ctx.arc(J.x + Math.cos(a) * 62, J.y + Math.sin(a) * 62, 9, 0, 7);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // --- Le joueur ---
  ctx.save();
  ctx.translate(J.x, J.y);

  // Clignote quand il est invincible
  ctx.globalAlpha = J.inv > 0 && J.inv % 6 < 3 ? .45 : 1;

  // Corps : une boule cyan avec un dégradé
  ctx.shadowColor = '#00f2fe';
  ctx.shadowBlur = 26;
  const pg = ctx.createRadialGradient(0, 0, 2, 0, 0, J.r);
  pg.addColorStop(0, '#fff');
  pg.addColorStop(1, '#00c6ff');
  ctx.fillStyle = pg;
  ctx.beginPath();
  ctx.arc(0, 0, J.r, 0, 7);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Cercle en pointillés qui tourne autour du joueur
  ctx.rotate(J.ang);
  ctx.setLineDash([6, 6]);
  ctx.strokeStyle = '#00f2fe';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, J.r + 7, 0, 7);
  ctx.stroke();
  ctx.setLineDash([]);

  // Petite flèche blanche qui montre la direction de visée
  ctx.rotate(J.aim - J.ang);
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(J.r + 11, 0);
  ctx.lineTo(J.r - 2, -6);
  ctx.lineTo(J.r - 2, 6);
  ctx.fill();
  ctx.rotate(-J.aim);

  // Cercle bleu du bouclier (plus il est faible, plus il est transparent)
  if (J.sh > 0) {
    ctx.globalAlpha = .3 + .5 * J.sh / J.smax;
    ctx.strokeStyle = '#4cc9f0';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, J.r + 15, 0, 7);
    ctx.stroke();
  }

  ctx.restore();

  // --- Textes flottants (dégâts, or...) qui montent et s'effacent ---
  ctx.textAlign = 'center';
  for (let i = ft.length - 1; i >= 0; i--) {
    const f = ft[i];

    f.y -= .7;
    f.t--;

    if (f.t <= 0) {
      ft.splice(i, 1);
      continue;
    }

    ctx.globalAlpha = Math.min(1, f.t / 20);
    ctx.fillStyle = f.c;
    ctx.font = `bold ${f.z}px Segoe UI,sans-serif`;
    ctx.fillText(f.s, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  // Fin de l'effet de tremblement
  ctx.restore();

  // --- Viseur rose (mode manuel uniquement) ---
  if (!auto) {
    ctx.strokeStyle = '#ff2d95';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(mx, my, 11, 0, 7);
    ctx.moveTo(mx - 18, my);
    ctx.lineTo(mx - 6, my);
    ctx.moveTo(mx + 6, my);
    ctx.lineTo(mx + 18, my);
    ctx.moveTo(mx, my - 18);
    ctx.lineTo(mx, my - 6);
    ctx.moveTo(mx, my + 6);
    ctx.lineTo(mx, my + 18);
    ctx.stroke();
  }

  // --- Grande bannière au début de la vague ("Vague 3" / "BOSS") ---
  if (bn > 0 && state === 'PLAY') {
    ctx.globalAlpha = Math.min(1, bn / 40);
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#c13584';
    ctx.shadowBlur = 30;
    ctx.font = 'bold 64px Segoe UI,sans-serif';
    ctx.fillText(tw, W / 2, H / 2 - 90);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  // --- Écran de pause ---
  if (state === 'PAUSE') {
    ctx.fillStyle = '#000a';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 56px Segoe UI,sans-serif';
    ctx.fillText('⏸ PAUSE', W / 2, H / 2);
    ctx.font = '18px Segoe UI,sans-serif';
    ctx.fillText('Appuie sur P pour reprendre', W / 2, H / 2 + 36);
  }

  // --- Message de fin de vague (pendant la récupération de l'or) ---
  if (state === 'CLEAR') {
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#00f2fe';
    ctx.shadowBlur = 24;
    ctx.font = 'bold 54px Segoe UI,sans-serif';
    ctx.fillText('Fin de vague !', W / 2, H / 2 - 80);
    ctx.shadowBlur = 0;
    ctx.font = '20px Segoe UI,sans-serif';
    ctx.fillText('Récupération de l’or… le menu arrive', W / 2, H / 2 - 45);
  }
}


/* =====================================================
   12. HUD : met à jour les infos affichées à l'écran
   ===================================================== */

function hud() {
  // Barre et texte de vie
  $('hpb').style.width = Math.max(0, J.hp / J.mhp * 100) + '%';
  $('hpt').textContent = `❤️ ${Math.max(0, Math.ceil(J.hp))}/${J.mhp}`;

  // Barre de bouclier
  $('shb').style.width = J.smax ? J.sh / J.smax * 100 + '%' : '0';

  // Numéro de vague et barre d'objectif
  $('uv').textContent = vague;
  $('ob').style.width = Math.min(100, wk / tot * 100) + '%';
  $('ot').textContent = `🎯 Objectif : ${wk}/${tot}`;

  // Or et score
  $('ug').textContent = gold;
  $('us').textContent = score;

  // Recharges du dash et de la nova
  $('ab').textContent = `💨 ${J.dc > 0 ? (J.dc / 60).toFixed(1) + ' s' : 'prêt'}  ·  💥 ${lv.nova ? (J.nc > 0 ? (J.nc / 60).toFixed(1) + ' s' : 'prêt [R]') : '—'}`;
}


/* =====================================================
   13. BOUCLE PRINCIPALE
   ===================================================== */

let last = 0;  // heure de l'image précédente
let acc = 0;   // temps accumulé à "dépenser" en mises à jour

function loop(t) {
  // Temps écoulé depuis la dernière image (limité à 100 ms)
  const dt = Math.min(100, t - last || 16);
  last = t;
  acc += dt;

  // Le jeu avance par pas fixes de 1/60e de seconde (même vitesse sur tous les écrans)
  while (acc >= 16.67) {
    if (state === 'PLAY' || state === 'CLEAR') update();
    acc -= 16.67;
  }

  draw();
  hud();
  requestAnimationFrame(loop);
}


/* =====================================================
   14. LANCEMENT DU JEU
   ===================================================== */

start();
requestAnimationFrame(loop);

</script>
